# ==============================================================================
# Nginx Reverse Proxy for BiharCabs (Oracle Linux 9)
# Install at: /etc/nginx/conf.d/biharcabs.conf
#
# Phase 1 (Staging): Keep server_name as staging.biharcabs.com and staging-crm.biharcabs.com,
#   then run:
#     sudo certbot --nginx -d staging.biharcabs.com -d staging-crm.biharcabs.com
#
# Phase 2 (Production Cutover): Add biharcabs.com www.biharcabs.com and crm.biharcabs.com
#   (or replace staging server names), test with `sudo nginx -t`, reload, and run:
#     sudo certbot --nginx -d biharcabs.com -d www.biharcabs.com -d crm.biharcabs.com
#
# Note: n8n (127.0.0.1:5678) is intentionally NEVER proxied by Nginx.
#   Access n8n strictly over SSH tunnel: ssh -L 5678:127.0.0.1:5678 opc@<server-ip>
# ==============================================================================

# --- WordPress (Public Website) ---
server {
    listen 80;
    listen [::]:80;
    server_name staging.biharcabs.com;

    client_max_body_size 25M;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Block sensitive WordPress & repo paths
    location = /xmlrpc.php { deny all; return 403; }
    location ~* ^/(\.env|\.git|\.private|wp-config\.php|readme\.html|license\.txt) {
        deny all;
        return 403;
    }

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}

# --- BiharCabs Operational CRM (Next.js) ---
server {
    listen 80;
    listen [::]:80;
    server_name staging-crm.biharcabs.com;

    client_max_body_size 25M;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }
}
