                        <script>
                            function submitModalBooking() {
                                const name = document.getElementById('name_modal').value;
                                const phone = document.getElementById('phone_modal').value;
                                const pickup = document.getElementById('pickup_location_modal').value;
                                const drop = document.getElementById('drop_location_modal').value;
                                const date = document.getElementById('date_modal').value;
                                const time = document.getElementById('time_modal').value;
                                const passengers = document.getElementById('passengers_modal').value;
                                const category = document.getElementById('category_modal').value;
                                const instructions = document.getElementById('instructions_modal').value;

                                if (!pickup || !drop) {
                                    alert("Please fill in Pickup and Drop locations.");
                                    return;
                                }

                                const estDist = document.getElementById('estimated_distance_modal') ? document.getElementById('estimated_distance_modal').innerText : '';

                                let message = `Hello BiharCabs! I would like to make an Instant Booking.\n\n*Name:* ${name || 'N/A'}\n*Phone:* ${phone || 'N/A'}\n*Category:* ${category}\n*Pickup:* ${pickup}\n*Drop:* ${drop}\n*Date:* ${date || 'N/A'}\n*Time:* ${time || 'N/A'}\n*Passengers:* ${passengers}`;

                                if (instructions) {
                                    message += `\n*Instructions:* ${instructions}`;
                                }

                                if (estDist && estDist !== '-') {
                                    message += `\n*Distance:* ${estDist}`;
                                }

                                message += `\n\nPlease confirm availability and fare.`;
                                const whatsappUrl = `https://wa.me/917070992170?text=${encodeURIComponent(message)}`;
                                window.open(whatsappUrl, '_blank', 'noopener,noreferrer');
                            }

    <script>
        // Disable past dates and times strictly in all booking forms
        document.addEventListener('DOMContentLoaded', function() {
            const dateInputs = document.querySelectorAll('input[type="date"]');
            const timeInputs = document.querySelectorAll('input[type="time"]');

            function getTodayStr() {
                const now = new Date();
                const year = now.getFullYear();
                const month = String(now.getMonth() + 1).padStart(2, '0');
                const day = String(now.getDate()).padStart(2, '0');
                return `${year}-${month}-${day}`;
            }

            function getCurrentTimeStr() {
                const now = new Date();
                const currentHours = now.getHours().toString().padStart(2, '0');
                const currentMinutes = now.getMinutes().toString().padStart(2, '0');
                return `${currentHours}:${currentMinutes}`;
            }

            function enforceTimeConstraint(dateInput, timeInput) {
                if (!dateInput || !timeInput) return;
                const todayStr = getTodayStr();
                const currentTimeStr = getCurrentTimeStr();
                
                if (dateInput.value === todayStr) {
                    timeInput.setAttribute('min', currentTimeStr);
                    if (timeInput.value && timeInput.value < currentTimeStr) {
                        timeInput.value = currentTimeStr;
                        // Show a small native toast/alert if possible or just rely on correction
                    }
                } else {
                    timeInput.removeAttribute('min');
                }
            }

            dateInputs.forEach(dateInput => {
                dateInput.setAttribute('min', getTodayStr());
                if (!dateInput.value) {
                    dateInput.value = getTodayStr();
                }
                
                dateInput.addEventListener('change', function() {
                    if (this.value && this.value < getTodayStr()) {
                        this.value = getTodayStr();
                    }
                    const form = this.closest('form') || this.closest('.row');
                    if (form) enforceTimeConstraint(this, form.querySelector('input[type="time"]'));
                });
            });

            timeInputs.forEach(timeInput => {
                const enforce = function() {
                    const form = this.closest('form') || this.closest('.row');
                    if (form) enforceTimeConstraint(form.querySelector('input[type="date"]'), this);
                };
                timeInput.addEventListener('change', enforce);
                timeInput.addEventListener('input', enforce);
                timeInput.addEventListener('blur', enforce);
            });

            function updateAllConstraints() {
                dateInputs.forEach(dateInput => {
                    dateInput.setAttribute('min', getTodayStr());
                    const form = dateInput.closest('form') || dateInput.closest('.row');
                    if (form) enforceTimeConstraint(dateInput, form.querySelector('input[type="time"]'));
                });
            }

            updateAllConstraints();
            setInterval(updateAllConstraints, 60000);
        });
    </script>
